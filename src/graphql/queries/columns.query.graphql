query getAllColumnsAllCards{
    columns {
        board_id,
        id,
        name,
        position
        cards{
            id
            column_id
            title
            description
            position
            assignee
        }
    }
}

query getColumn($id: uuid!){
    columns_by_pk(id: $id){
        board_id,
        id,
        name,
        position
    }
}