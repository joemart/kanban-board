mutation addBoard($object: boards_insert_input!) {
  insert_boards_one(object: $object) {
    id      # Returns auto-generated id
    name
    owner
    position
  }
}

mutation deleteBoard($boardId: uuid!){
  delete_boards_by_pk(id: $boardId){
    id
  }
}

mutation editBoard($set:boards_set_input, $id: uuid!){
  update_boards_by_pk(pk_columns:{id:$id}, _set: $set){

      id
      name
      owner
      position
    
  }
}